<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Smart Search Favorites</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 380px;
      background: #1a1a1a;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      background: #242424;
      border-bottom: 1px solid #333;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ed2553;
      box-shadow: 0 0 8px #ed2553;
    }
    .section {
      padding: 10px 14px;
      border-bottom: 1px solid #2c2c2c;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .domain-label {
      font-size: 13.5px;
      font-weight: 600;
      color: #fff;
      word-break: break-all;
    }
    .sub-label {
      font-size: 11.5px;
      color: #999;
      margin-top: 2px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 22px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #3f3f46;
      transition: .2s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #2ea043; }
    input:checked + .slider:before { transform: translateX(20px); }

    .btn-full {
      width: 100%;
      background: #2b2b2b;
      color: #ddd;
      border: 1px solid #3f3f3f;
      border-radius: 5px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 7px;
      text-align: center;
      transition: background 0.12s;
    }
    .btn-full:hover { background: #383838; color: #fff; }
    .btn-danger:hover { background: #4a1c26; color: #ff809b; border-color: #7a293b; }

    /* Block Constructor in Popup */
    .block-list {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .block-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #232327;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
    }
    .block-item label {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      flex: 1;
    }
    .arr-btn {
      background: #2e2e34;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 3px;
      width: 22px;
      height: 20px;
      font-size: 10px;
      cursor: pointer;
      padding: 0;
    }
    .arr-btn:hover { background: #444; color: #fff; }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .status-msg {
      font-size: 11.5px;
      color: #4ade80;
      margin-top: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>Smart Search Bar</span>
    </div>
    <span style="font-size:11px;color:#888;">v3.2 • Конструктор</span>
  </div>

  <div class="section">
    <div class="toggle-row">
      <div>
        <div class="domain-label" id="current-domain">nyaa.si</div>
        <div class="sub-label" id="domain-status">Активно на этом сайте</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="site-toggle">
        <span class="slider"></span>
      </label>
    </div>
    <button class="btn-full" id="pick-input-btn">🎯 Указать строку поиска кликом</button>
    <div class="toggle-row" style="margin-top:8px;">
      <div>
        <div style="font-size:12.5px;font-weight:500;color:#ddd;">Сбор тегов со страниц (+)</div>
        <div class="sub-label">Кнопки при наведении на теги галереи</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="hover-collect-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="font-weight:600;color:#60a5fa;">⚙️ Конструктор отображаемых блоков</span>
      <span style="font-size:11px;color:#f5b942;cursor:pointer;" id="reset-layout-btn">↺ Сбросить</span>
    </div>
    <div class="sub-label">Включайте нужные блоки и меняйте их строчки (▲/▼):</div>
    <div class="block-list" id="block-list"></div>
  </div>

  <div class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="font-weight:600;color:#ccc;">📚 Внешняя база тегов</span>
      <span style="font-size:11px;color:#888;" id="custom-db-count">0 тегов</span>
    </div>
    <div class="actions-grid">
      <button class="btn-full" id="import-tagdb-btn" style="margin-top:6px;">⬆ Загрузить теги</button>
      <button class="btn-full btn-danger" id="clear-tagdb-btn" style="margin-top:6px;">🗑 Очистить базу</button>
    </div>
    <input type="file" id="import-tagdb-file" accept=".csv,.json,.txt" style="display:none;">
  </div>

  <div class="section" style="border-bottom:none;">
    <div style="font-weight:600;color:#ccc;margin-bottom:4px;">Резервная копия профилей (.json)</div>
    <div class="actions-grid">
      <button class="btn-full" id="export-btn" style="margin-top:4px;">⬇ Экспорт</button>
      <button class="btn-full" id="import-btn" style="margin-top:4px;">⬆ Импорт</button>
    </div>
    <input type="file" id="import-file" accept=".json" style="display:none;">
    <div class="status-msg" id="status-msg">Сохранено!</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
